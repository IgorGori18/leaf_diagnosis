services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leaf_diagnosis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    command: sh /app/entrypoint.sh
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/leaf_diagnosis
      OLLAMA_URL: http://ollama:11434/api/generate
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8082:5173"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
